function join07(i){if(!faction07[i])return;if(s.members[i]){s.members[i]=false;record07('Left '+faction07[i]+'.');}else if(s.rep[i]>=2){s.members[i]=true;record07('Joined '+faction07[i]+'.'+(s.members.filter(Boolean).length>1?' Other memberships are noted.':''));}else say('Earn 2 reputation with this faction first.');render();}

function deliver07(){let c=s.contract;if(!c||s.place!==c.to||s.day>c.due){say('Contract destination or deadline not met.');render();return;}if(s.food<1||s.water<1){say('Delivery requires one food and one water.');render();return;}s.food--;s.water--;s.towns[s.place].stock=Math.min(100,s.towns[s.place].stock+2);s.cash+=24;s.rep[c.faction]+=2;s.xp+=20;s.contractsDone++;s.contract=null;record07('Delivered supplies; earned 24 credits and faction reputation.');render();}
function labor07(){let m=s.markets[s.place];if(m.jobDay===s.day||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('No work available or recovery needed.');render();return;}m.jobDay=s.day;let shortage=s.towns[s.place].stock<25;tick(2);s.towns[s.place].stock=Math.min(100,s.towns[s.place].stock+3);s.cash+=shortage?18:10;s.xp+=8;practice('Trade');record07(shortage?'Emergency supply shift completed.':'Local production shift completed.');render();}
function property07(type){let m=s.markets[s.place];if(type==='house'&&!m.house&&s.cash>=50){s.cash-=50;m.house=true;record07('Bought local house.');}else if(type==='business'&&!m.business&&s.cash>=80){s.cash-=80;m.business=true;record07('Bought local supply shop.');}else if(type==='auto'&&m.business){m.automate=!m.automate;record07('Business automation '+(m.automate?'enabled.':'disabled.'));}else if(type==='operate'&&m.business&&!m.automate&&m.jobDay!==s.day&&s.towns[s.place].stock>=2&&Math.max(s.hunger,s.thirst,s.cold,s.fatigue)<85){m.jobDay=s.day;s.towns[s.place].stock-=2;tick(2);s.cash+=9;s.earnings+=9;s.xp+=5;record07('Operated supply shop.');}else say('Purchase or operation unavailable.');render();}
function project07(){let m=s.markets[s.place];if(m.project>=3||s.goods.parts<1||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Project requires a spare part, energy and unfinished work.');render();return;}s.goods.parts--;m.project++;tick(2);practice('Repair');s.xp+=8;if(m.project===3){m.power=true;m.heat=2;s.rep[0]+=3;record07('Local heating and power restored. Production improves.');}else record07('Community infrastructure work completed.');render();}
function homestead07(){if(s.homeStage<0){if(!s.markets[s.place].house){say('Own a local house before establishing a homestead.');render();return;}s.homeStage=0;s.homePlace=s.place;s.homePopulation=1;sync09();record07('Established homestead.');}else if(s.place!==s.homePlace||s.homeStage===3){say('Return to homestead or maximum stage reached.');render();return;}else if(s.homeProgress>=3){if(s.homePopulation<[1,5,15][s.homeStage]||!powered10(s.place)){say('Growth requires residents and restored power.');render();return;}s.homeStage++;s.homeProgress=0;record07('Settlement grew into a '+stage07[s.homeStage]+'.');}else if(s.goods.parts>=1&&s.cash>=10){s.goods.parts--;s.cash-=10;s.homeProgress++;tick(2);record07('Contributed to settlement growth.');}else say('Needs a spare part and 10 credits.');render();}
function storage07(k,deposit){if(s.place!==s.homePlace||!['food','water','parts','cloth'].includes(k))return;if(deposit&&available07(k)>0){add07(k,-1);s.homeStorage[k]++;}else if(!deposit&&s.homeStorage[k]>0){s.homeStorage[k]--;add07(k,1);}render();}
function discover07(){let i=s.place;if(s.discoveredSites.includes(i)){say('Local site already discovered.');render();return;}if(Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Recover before exploring.');render();return;}let ok=check('Explore',35+i*4);tick(2);if(ok){s.discoveredSites.push(i);s.xp+=12;record07('Discovered '+sites07[i]+'.');}else say('No discovery this time.');render();}
function search07(){let i=s.place;if(!s.discoveredSites.includes(i)||s.siteLooted.includes(i)){say('No unsearched site here.');render();return;}if(Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Recover before searching.');render();return;}let ok=check('Repair',30+i*4)||check('Explore',35+i*4);tick(2);if(ok){s.siteLooted.push(i);s.goods.parts+=2;s.goods.cloth++;s.food++;s.xp+=15;record07('Recovered supplies and a historical record from '+sites07[i]+'.');}render();}
function research07(){if(s.research>=s.siteLooted.length||s.cash<5||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Research needs an unread recovered record, 5 credits and energy.');render();return;}s.cash-=5;s.research++;tick(2);practice('Repair');s.xp+=12;record07('Studied recovered technology. Records understood: '+s.research+'.');render();}
function coat07(){if(s.warmLayer||s.goods.cloth<2){say('Needs two cloth units or already equipped.');render();return;}s.goods.cloth-=2;s.warmLayer=true;s.layers11[1]=2;record07('Added an insulating clothing layer.');render();}
function panel07(){let m=s.markets[s.place],c=s.contract;return `<section id="economy07"><h2>Regional economy</h2><p>Bank: ${s.bank} credits · Merchant shipments: ${s.shipments} · Business earnings: ${s.earnings}</p><button onclick="bank07(true)">Deposit 10</button><button onclick="bank07(false)">Withdraw 10</button><p>Inventory: Parts ${s.goods.parts} · Cloth ${s.goods.cloth} · Fuel ${s.fuel}</p>${goods07.map(k=>`<p>${k}: ${m[k]} in stock · ${price07(k)} credits <button onclick="trade07('${k}',true)">Buy</button>${k==='fuel'?'':`<button onclick="trade07('${k}',false)">Sell</button>`}</p>`).join('')}<button onclick="labor07()">Local production job</button><small>Shortages raise wages; snow delays merchant shipments.</small></section><section id="factions07"><h2>Faction membership & contracts</h2>${faction07.map((n,i)=>`<p>${n} · ${s.members[i]?'Member':'Non-member'} · ${s.rep[i]>=8?'Respected':s.rep[i]>=2?'Recognized':'Unknown'} <button onclick="membership08(${i})">${s.members[i]?'Leave':'Join'}</button><button onclick="accept07(${i})">Supply contract</button></p>`).join('')}${c?`<p>Deliver one food and one water to ${places[c.to]} by day ${c.due}.</p><button onclick="deliver07()">Complete delivery</button>`:'<p>No active contract.</p>'}<p>Completed contracts: ${s.contractsDone}. NPC leaders remain in charge.</p></section><section id="property07"><h2>Property & community</h2><p>${m.house?'House owned':'House available (50)'} · ${m.business?'Shop owned':'Shop available (80)'}</p><button onclick="property07('house')">Buy house</button><button onclick="property07('business')">Buy shop</button><button onclick="property07('auto')">Automation: ${m.automate?'On':'Off'}</button><button onclick="property07('operate')">Operate shop</button><p>Local generation ${m.power?'restored':'offline'} · Regional power ${powered10(s.place)?'online':'offline'} · Project ${m.project}/3</p><button onclick="project07()">Community project (1 part)</button><p>${s.homeStage<0?'No homestead':stage07[s.homeStage]+' at '+places[s.homePlace]+' · Residents '+s.homePopulation+' · Growth '+s.homeProgress+'/3'}</p><button onclick="homestead07()">${s.homeStage<0?'Establish homestead':'Contribute / advance stage'}</button>${s.homePlace===s.place?['food','water','parts','cloth'].map(k=>`<p>Stored ${k}: ${s.homeStorage[k]} <button onclick="storage07('${k}',true)">Store</button><button onclick="storage07('${k}',false)">Take</button></p>`).join(''):''}</section><section id="explore07"><h2>Exploration & equipment</h2><p>${s.discoveredSites.includes(s.place)?sites07[s.place]:'Uncharted local site'} · ${s.siteLooted.includes(s.place)?'Searched':'Unsearched'}</p><button onclick="discover07()">Explore area</button><button onclick="search07()">Search discovered site</button><button onclick="research07()">Study recovered record (5)</button><p>Records understood ${s.research}/${s.siteLooted.length}</p><button onclick="coat07()">${s.warmLayer?'Insulating layer equipped':'Craft insulating layer (2 cloth)'}</button><p>Field journal: ${s.journal07.map(esc).join('<br>')||'No discoveries yet.'}</p></section>`;}

// v0.8: civic simulation. All names and laws are fictional game content.
const leaders08=['Clerk Merrin','Factor Vale','Steward Ellis'];
const pairs08=[[0,1],[0,2],[1,2]];
const authorities08=[0,1,2,0,2];
const law08=['Supply charter','Market charter','Community charter','Transit charter','Council charter'];
const titles08=['Unrecognized','Recognized','Associate','Representative','Senior officer'];
function init08(x){x.civicVersion=8;x.diplomacy=[10,0,5];x.standing=[0,0,0];x.civic=places.map((_,i)=>({authority:authorities08[i],stability:50,assignmentDay:0,serviceDay:0,pledgeDay:0,infraLabor:0,rentalUntil:0}));x.cases=[];x.nextCase=1;x.resolvedCases=0;x.serviceCount=0;}
function valid08(x){const n=(v,a=0,b=1e9)=>Number.isInteger(v)&&v>=a&&v<=b;return x.civicVersion===8&&Array.isArray(x.diplomacy)&&x.diplomacy.length===3&&x.diplomacy.every(v=>n(v,-100,100))&&Array.isArray(x.standing)&&x.standing.length===3&&x.standing.every(v=>n(v,-100,100))&&Array.isArray(x.civic)&&x.civic.length===5&&x.civic.every(c=>c&&n(c.authority,0,2)&&n(c.stability,0,100)&&['assignmentDay','serviceDay','pledgeDay'].every(k=>n(c[k],0,x.day))&&n(c.infraLabor,0,3)&&n(c.rentalUntil,0,x.day+7))&&Array.isArray(x.cases)&&x.cases.length<=50&&new Set(x.cases.map(c=>c.id)).size===x.cases.length&&x.cases.every(c=>c&&n(c.id,1,x.nextCase-1)&&n(c.place,0,4)&&n(c.faction,0,2)&&n(c.fine,1,30)&&n(c.service,1,3)&&['Pending hearing','Resolved hearing'].includes(c.status))&&n(x.nextCase,1)&&n(x.resolvedCases)&&n(x.serviceCount);}
const clamp08=(v)=>Math.max(-100,Math.min(100,v));
function pair08(a,b){return pairs08.findIndex(p=>p.includes(a)&&p.includes(b));}
function relation08(a,b){return a===b?100:s.diplomacy[pair08(a,b)];}
function factionRank08(i){return titles08[MaineRules.factionRank(s.rep[i],s.standing[i],s.members[i])];}
function relationName08(v){return v>=40?'Allied':v<=-40?'Rival':v>=10?'Cooperative':v<=-10?'Strained':'Neutral';}
function membership08(i){if(!faction07[i])return;let was=s.members[i];join07(i);if(!was&&s.members[i])for(let j=0;j<3;j++)if(j!==i&&s.members[j]&&relation08(i,j)<0){s.standing[j]=clamp08(s.standing[j]-3);record07(faction07[j]+' notes your competing membership.');}render();}
function mediation08(j){let c=s.civic[s.place],i=s.org?faction07.indexOf(s.org.faction):-1;if(i<0||!faction07[j]||j===i||c.pledgeDay===s.day||s.org.funds<5||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Mediation requires an organization, 5 treasury credits and a fresh day.');render();return;}c.pledgeDay=s.day;s.org.funds-=5;let ok=check('Speech',45);let p=pair08(i,j);s.diplomacy[p]=clamp08(s.diplomacy[p]+(ok?12:2));if(ok){s.rep[i]++;s.rep[j]++;s.xp+=8;}tick(2);record07('Organization mediation: '+relationName08(s.diplomacy[p])+'.');render();}
function assignment08(){let c=s.civic[s.place],i=c.authority;if(!s.members[i]||c.assignmentDay===s.day||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Local faction membership and an available assignment required.');render();return;}c.assignmentDay=s.day;let k=s.towns[s.place].stock<25?'Trade':'Speech';let ok=check(k,40);tick(2);if(ok){s.rep[i]+=2;s.cash+=8;s.xp+=10;c.stability=Math.min(100,c.stability+4);s.towns[s.place].stock=Math.min(100,s.towns[s.place].stock+2);record07('Completed '+faction07[i]+' civic assignment.');}else record07('Assignment incomplete; time spent, no payment.');render();}
function citation08(contract){let i=contract.from;if(s.cases.length>=50){record07('Civic docket full; overdue contract recorded as standing loss.');s.standing[contract.faction]=clamp08(s.standing[contract.faction]-2);return;}s.cases.push({id:s.nextCase++,place:i,faction:contract.faction,fine:[8,10,6,12,8][i],service:2,status:'Pending hearing'});s.standing[contract.faction]=clamp08(s.standing[contract.faction]-2);record07('Late supply delivery: notice issued by '+places[i]+'.');}
function resolve08(id,action){let c=s.cases.find(c=>c.id===id);if(!c||c.place!==s.place){say('Return to the issuing settlement.');render();return;}if(action==='hearing'&&c.status==='Pending hearing'){if(Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Recover before the hearing.');render();return;}c.status='Resolved hearing';if(check('Speech',40)){c.fine=Math.max(1,c.fine-3);c.service=1;}tick(1);record07('Civic hearing completed; settlement offers fine or service.');}else if(action==='pay'&&s.cash>=c.fine){s.cash-=c.fine;s.cases=s.cases.filter(x=>x.id!==id);s.resolvedCases++;record07('Civic fine paid. Standing loss remains.');}else if(action==='service'&&s.civic[s.place].serviceDay!==s.day&&Math.max(s.hunger,s.thirst,s.cold,s.fatigue)<85){s.civic[s.place].serviceDay=s.day;tick(2);s.serviceCount++;s.towns[s.place].stock=Math.min(100,s.towns[s.place].stock+2);if(--c.service===0){s.cases=s.cases.filter(x=>x.id!==id);s.resolvedCases++;record07('Community service completed.');}else record07('Community service shift completed.');}else say('Action unavailable or recovery needed.');render();}
function daily08(){if(s.contract&&s.day>s.contract.due)citation08(s.contract);for(let i=0;i<5;i++){let c=s.civic[i],t=s.towns[i],m=s.markets[i];c.stability=Math.max(0,Math.min(100,c.stability+(t.stock>=35?3:t.stock<15?-8:-1)+(powered10(i)?2:0)));if(c.stability<=20){let old=c.authority;c.authority=(old+1)%3;c.stability=45;record07(places[i]+' council changes administration to '+faction07[c.authority]+'.');}}}
function volunteer08(){let c=s.civic[s.place],m=s.markets[s.place];if(m.power||c.serviceDay===s.day||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('No available community labor shift.');render();return;}c.serviceDay=s.day;let ok=check('Repair',35);tick(2);if(ok){c.infraLabor++;s.xp+=8;if(c.infraLabor>=3){m.project=Math.min(3,m.project+1);c.infraLabor=0;if(m.project===3){m.power=true;m.heat=2;s.rep[0]+=3;}}record07('Contributed professional labor to infrastructure.');}else record07('Community labor shift finished without progress.');render();}
function rent08(){let c=s.civic[s.place];if(s.markets[s.place].house||c.rentalUntil>s.day||s.cash<7){say('Rental unavailable or already paid.');render();return;}s.cash-=7;c.rentalUntil=s.day+2;record07('Rented local lodging for two days.');render();}
function panel08(){let c=s.civic[s.place];return `<section id="civic08"><h2>Council & local law</h2><p>${law08[s.place]} · ${faction07[c.authority]} administration · NPC leader ${leaders08[c.authority]} · Stability ${c.stability}%</p><p>Local charter: late supply contracts carry a civic notice. Resolve at issuing settlement by hearing, fine or community service. No travel lock.</p><button onclick="assignment08()">Local faction assignment</button><button onclick="volunteer08()">Volunteer professional labor</button><p>Labor ${c.infraLabor}/3 toward one infrastructure stage.</p>${s.cases.map(x=>`<p>Notice #${x.id} · ${places[x.place]} · ${x.status} · ${x.fine} credits or ${x.service} service shifts</p>${x.place===s.place?`<button onclick="resolve08(${x.id},'hearing')" ${x.status!=='Pending hearing'?'disabled':''}>Hearing</button><button onclick="resolve08(${x.id},'pay')">Pay fine</button><button onclick="resolve08(${x.id},'service')">Community service</button>`:''}`).join('')||'<p>No outstanding notices.</p>'}<p>Resolved notices: ${s.resolvedCases}</p><h3>Faction standing</h3>${faction07.map((f,i)=>`<p>${f}: ${factionRank08(i)} · Standing ${s.standing[i]} · Leader ${leaders08[i]}</p>`).join('')}${pairs08.map(([a,b],i)=>`<p>${faction07[a]} / ${faction07[b]}: ${relationName08(s.diplomacy[i])} (${s.diplomacy[i]})</p>`).join('')}${s.org?faction07.filter(f=>f!==s.org.faction).map(f=>`<button onclick="mediation08(${faction07.indexOf(f)})">Mediate with ${f} (5 treasury)</button>`).join(''):'<p>Establish an organization to mediate faction relations.</p>'}<h3>Lodging</h3><p>${s.markets[s.place].house?'Owned home':c.rentalUntil>s.day?'Rental paid through day '+(c.rentalUntil-1):'Public shelter available; private lodging 7 credits for two days.'}</p><button onclick="rent08()">Rent lodging</button></section>`;}

// v0.9: persistent property, community services and resident roster.
const roles09=['Caretaker','Grower','Shopkeeper','Technician','Courier','Clinic aide'];
const names09=['Avery','Robin','Casey','Jamie','Drew','Taylor','Sam','Jordan','Reese','Alex','Morgan','Lee'];
const service09=[{name:'Storehouse',stage:0,parts:2,cash:20},{name:'Community kitchen',stage:1,parts:3,cash:30},{name:'Clinic',stage:2,parts:4,cash:45}];
const items09=['food','water','parts','cloth'];
function init09(x){x.propertyVersion=9;x.properties=places.map(()=>({storage:{food:0,water:0,parts:0,cloth:0},worker:false,serviceDays:[0,0,0],upkeep:0}));x.residents=[];x.nextResident=1;x.services=[false,false,false];x.migrations=0;x.communityMeals=0;x.clinicVisits=0;sync09(x);}
function sync09(x=s){while(x.residents.length<x.homePopulation){let id=x.nextResident++;x.residents.push({id,role:roles09[(id-1)%roles09.length],trust:0,lastTalk:0});}while(x.residents.length>x.homePopulation)x.residents.pop();}
function valid09(x){const n=(v,a=0,b=1e9)=>Number.isInteger(v)&&v>=a&&v<=b;return x.propertyVersion===9&&Array.isArray(x.properties)&&x.properties.length===5&&x.properties.every((p,i)=>p&&p.storage&&items09.every(k=>n(p.storage[k],0,1000000))&&typeof p.worker==='boolean'&&(!p.worker||x.markets[i].business)&&Array.isArray(p.serviceDays)&&p.serviceDays.length===3&&p.serviceDays.every(v=>n(v,0,x.day))&&n(p.upkeep))&&Array.isArray(x.residents)&&x.residents.length===x.homePopulation&&new Set(x.residents.map(r=>r.id)).size===x.residents.length&&x.residents.every(r=>r&&n(r.id,1,x.nextResident-1)&&roles09.includes(r.role)&&n(r.trust,0,100)&&n(r.lastTalk,0,x.day))&&n(x.nextResident,1)&&Array.isArray(x.services)&&x.services.length===3&&x.services.every((v,i)=>typeof v==='boolean'&&(!v||x.homeStage>=service09[i].stage))&&n(x.migrations)&&n(x.communityMeals)&&n(x.clinicVisits);}
function houseStore09(k,put){if(!items09.includes(k)||!s.markets[s.place].house)return;let box=s.properties[s.place].storage;if(put&&available07(k)>0){add07(k,-1);box[k]++;}else if(!put&&box[k]>0){box[k]--;add07(k,1);}else say('No supplies to transfer.');render();}
function bulk09(k,put){if(!items09.includes(k)||s.place!==s.homePlace||!s.services[0])return;let qty=Math.min(5,put?available07(k):s.homeStorage[k]);if(qty>0){add07(k,put?-qty:qty);s.homeStorage[k]+=put?qty:-qty;}else say('No supplies to transfer.');render();}
function hire09(){let m=s.markets[s.place],p=s.properties[s.place];if(!m.business){say('Own a shop first.');}else if(p.worker){p.worker=false;m.automate=false;record07('Shop employee released.');}else if(s.cash>=12){s.cash-=12;p.worker=true;m.automate=true;record07('Hired a local shop employee. Daily wage: 2 credits when trading.');}else say('Hiring requires 12 credits.');render();}
function buildService09(i){let spec=service09[i];if(!spec||s.place!==s.homePlace||s.homeStage<spec.stage||s.services[i]||!powered10(s.place)||s.goods.parts<spec.parts||s.cash<spec.cash||Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Requires the listed stage, power, supplies and credits.');render();return;}s.goods.parts-=spec.parts;s.cash-=spec.cash;s.services[i]=true;s.xp+=12;tick(2);record07('Opened '+spec.name+'.');render();}
function useService09(i){let p=s.properties[s.place];if(s.place!==s.homePlace||!s.services[i]||p.serviceDays[i]===s.day||!powered10(s.place)){say('Service unavailable today.');render();return;}if(i===1&&s.towns[s.place].stock>=2){s.towns[s.place].stock-=2;s.hunger=Math.max(0,s.hunger-45);s.communityMeals++;}else if(i===2&&s.cash>=5){s.cash-=5;s.health=Math.min(100,s.health+30);s.clinicVisits++;}else{say('Supplies or credits unavailable.');render();return;}p.serviceDays[i]=s.day;record07('Used '+service09[i].name+'.');render();}
function greet09(id){let r=s.residents.find(r=>r.id===id);if(!r||s.place!==s.homePlace||r.lastTalk===s.day)return;r.lastTalk=s.day;r.trust=Math.min(100,r.trust+5);record07('Spoke with '+residentName09(r)+' about local life.');render();}

function daily09(){if(s.homePlace>=0){let i=s.homePlace,t=s.towns[i],before=s.residents.length;if(t.stock<12&&s.homePopulation>1)s.homePopulation--;sync09();if(before!==s.residents.length){s.migrations+=Math.abs(before-s.residents.length);record07('Settlement '+(before<s.residents.length?'welcomes a new resident.':'loses a resident during shortages.'));}if(s.services[1]&&powered10(i)&&t.stock>=15)t.stock=Math.min(100,t.stock+1);}}

function powered10(i,x=s){if(!Number.isInteger(i)||i<0||i>=5)return false;let lo=i,hi=i;while(lo>0&&x.gridLinks[lo-1])lo--;while(hi<4&&x.gridLinks[hi])hi++;return x.markets.slice(lo,hi+1).some(m=>m.power);}

function courierAccept10(i){let p=s.infrastructure[s.place];if(!Number.isInteger(i)||i<0||i>=5||Math.abs(i-s.place)!==1||s.courier||p.courierDay===s.day||!s.pass){say('Courier assignment unavailable. Passage and an adjacent destination required.');render();return;}p.courierDay=s.day;s.courier={from:s.place,to:i,due:s.day+3};record07('Accepted sealed dispatch for '+places[i]+'.');render();}

function transitAvailable10(i){return !s.local12&& Number.isInteger(i)&&i>=0&&i<5&&Math.abs(i-s.place)===1&&s.pass&&activeFacility10(s.place,2)&&activeFacility10(i,2)&&Math.max(s.snow[i],s.snow[s.place])<80&&relation08(s.civic[s.place].authority,s.civic[i].authority)>-40;}

function setNeed11(i,v){if(Number.isInteger(i)&&i>=0&&i<4&&[0,.5,1,2].includes(v)){s.rates11[i]=v;render();}}

function layer11(i){let l=layers11[i];if(!l)return;if(s.layers11[i]===0){if(s.goods.cloth<l.cost){say('Not enough cloth.');render();return;}s.goods.cloth-=l.cost;s.layers11[i]=2;record07('Made '+l.name+'.');}else s.layers11[i]=s.layers11[i]===2?1:2;s.warmLayer=s.layers11[1]>0;render();}
function camp11(){let i=s.place;if(s.camp11[i]){s.camp11[i]=false;s.goods.cloth+=1;record07('Packed temporary camp.');}else{if(s.goods.cloth<2||s.snow[i]>=90||!ready10()){say('Camp requires two cloth, suitable conditions and energy.');render();return;}s.goods.cloth-=2;s.camp11[i]=true;tick(1);record07('Established temporary camp near '+places[i]+'.');}render();}

function clinic11(){let i=s.place;if(s.clinic11[i]===s.day||s.cash<8||s.health>=100||!powered10(i)){say('Clinic requires local power, 8 credits and an available appointment.');render();return;}s.cash-=8;s.clinic11[i]=s.day;s.health=Math.min(100,s.health+25);record07('Received clinic care.');render();}
function survey11(){let i=s.place;if(s.survey11[i]===s.day||!ready10())return;s.survey11[i]=s.day;let ok=check('Explore',40);tick(1);if(ok){s.xp+=5;record07('Documented wildlife near '+places[i]+'.');}render();}

const endings15=[{name:'Civic partnership',text:'Harmony coordinates public services with the York civic office.',skill:'Speech',faction:0},{name:'Trade partnership',text:'Harmony opens a cooperative supply agreement with southern merchants.',skill:'Trade',faction:1},{name:'Independent network',text:'Harmony supports a network of locally managed workshops and communities.',skill:'Repair',faction:2}];
function init15(x){x.storyVersion=15;x.story15={intro:0,york:-1,reports:[false,false,false],ending:-1,postDay:0,postCount:0};}
function valid15(x){let q=x.story15,n=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;return x.storyVersion===15&&q&&n(q.intro,0,2)&&n(q.york,-1,2)&&Array.isArray(q.reports)&&q.reports.length===3&&q.reports.every(v=>typeof v==='boolean')&&n(q.ending,-1,2)&&n(q.postDay,0,x.day)&&n(q.postCount,0,1000000)&&(q.postCount===0)===(q.postDay===0)&&(q.postCount===0||q.ending!==-1);}
function storyReady15(){if(!s||s.local12||s.encounter13)return false;if(Math.max(s.hunger,s.thirst,s.cold,s.fatigue)>=85){say('Recover before continuing this assignment.');render();return false;}return true;}
function memory15(text){let n=s.npcs[s.place];n.trust=Math.min(100,n.trust+4);n.memory.push(text);n.memory=n.memory.slice(-8);}
function intro15(method){if(s.place!==0||!storyReady15()||!['talk','skill','labor'].includes(method))return;let q=s.story15,o=origins15[backgrounds.indexOf(s.bg)];if(q.intro===2)return;if(method==='talk'){if(q.intro===0){q.intro=1;record07(o.contact+': '+o.text);}render();return;}if(q.intro!==1)return;let ok=method==='labor'||check(o.skill,45,0);tick(method==='labor'?3:1);if(ok){q.intro=2;s.xp+=15;memory15('Completed background assignment');record07(o.result);}else say('The records remain unclear. Try again or help with the longer assignment.');render();}
function yorkQuest15(i,method){if(s.place!==0||!storyReady15()||!Number.isInteger(i)||!york15[i]||s.story15.york!==-1||!['skill','labor'].includes(method))return;let d=york15[i],ok=method==='labor'||check(d.skill,55,0);tick(method==='labor'?4:2);if(ok){s.story15.york=i;s.pass=true;s.clue=true;s.rep[d.faction]+=3;s.xp+=22;s.cash+=10;memory15('Completed '+d.name);record07(d.name+' completed. Passage granted.');}else say('Agreement not yet accepted. A longer records assignment is available.');render();}
function report15(method){let i=s.place-1;if(i<0||i>2||!s.pass||s.story15.reports[i]||!storyReady15()||!['skill','labor'].includes(method))return;let d=road15[s.place],ok=method==='labor'||check(d.skill,50);tick(method==='labor'?3:1);if(ok){s.story15.reports[i]=true;s.xp+=15;s.cash+=8;s.towns[s.place].stock=Math.min(100,s.towns[s.place].stock+3);memory15('Completed regional report');record07(d.title+' filed for Harmony.');}else say('Report incomplete; try the longer assignment.');render();}
function ending15(i,method){if(s.place!==4||!s.pass||s.story15.ending!==-1||!storyReady15()||!Number.isInteger(i)||!endings15[i]||!['skill','labor'].includes(method))return;let d=endings15[i],reports=s.story15.reports.filter(Boolean).length,ok=method==='labor'||check(d.skill,MaineRules.councilDifficulty(reports));tick(method==='labor'?4:1);if(ok){s.story15.ending=i;s.rep[d.faction]+=5;s.xp+=40;s.cash+=20;s.civic[4].stability=Math.min(100,s.civic[4].stability+8);memory15('Harmony agreement: '+d.name);record07('Chapter One resolved: '+d.name+'. '+d.text);}else say('The council requests more information or a longer consultation.');render();}
function post15(){if(s.place!==4||s.story15.ending===-1||s.story15.postDay===s.day||!storyReady15())return;tick(2);s.story15.postDay=s.day;s.story15.postCount++;s.cash+=12;s.xp+=8;s.towns[4].stock=Math.min(100,s.towns[4].stock+2);record07('Harmony follow-up: updated community service records.');render();}
function storyPanel15(){let q=s.story15,o=origins15[backgrounds.indexOf(s.bg)],p=s.place,reportCount=q.reports.filter(Boolean).length;let h=`<section id="story15"><h2>The Road to Harmony</h2><p>${q.ending>=0?'Chapter One resolved: '+endings15[q.ending].name:p===4?'Meet the Harmony council to resolve Chapter One.':s.pass?'Travel north and gather optional reports.':'Earn passage in York.'}</p><p>Background: ${esc(o.title)} — ${q.intro===2?'Complete':q.intro===1?'In progress':'Available in York'} · York agreement: ${q.york<0?'Optional':york15[q.york].name} · Regional reports: ${reportCount}/3</p>`;
 if(p===0){h+=`<h3>${esc(o.title)}</h3><p>${esc(o.start)} · ${esc(o.contact)}</p><p>${esc(o.text)}</p>`;if(q.intro===0)h+='<button onclick="intro15(\'talk\')">Speak to background contact</button>';else if(q.intro===1)h+=`<button onclick="intro15('skill')">${esc(o.action)} (${chance(o.skill,45,0)}%)</button><button onclick="intro15('labor')">${esc(o.fallback)} (3 hours)</button>`;else h+=`<p>${esc(o.result)}</p>`;h+='<h3>York faction agreements</h3>';if(q.york===-1)h+=york15.map((d,i)=>`<div><b>${d.name}</b><p>${d.text}</p><button onclick="yorkQuest15(${i},'skill')">Negotiate (${chance(d.skill,55,0)}%)</button><button onclick="yorkQuest15(${i},'labor')">Records assignment (4 hours)</button></div>`).join('');else h+='<p>Your chosen agreement has been recorded.</p>';}
 if(p>0&&p<4){let d=road15[p];h+=`<h3>${d.title}</h3><p>${d.text}</p>`+(q.reports[p-1]?'<p>Report filed.</p>':`<button onclick="report15('skill')">Complete report (${chance(d.skill,50)}%)</button><button onclick="report15('labor')">Extended report (3 hours)</button>`);}
 if(p===4){h+='<h3>Harmony council</h3>';if(q.ending===-1){h+=`<p>Archivist Quinn: “We have heard about your journey. Which partnership should we pursue?” ${reportCount} regional reports support your proposal.</p>`+endings15.map((d,i)=>`<div><b>${d.name}</b><p>${d.text}</p><button onclick="ending15(${i},'skill')">Propose (${chance(d.skill,MaineRules.councilDifficulty(reportCount))}%)</button><button onclick="ending15(${i},'labor')">Extended consultation (4 hours)</button></div>`).join('');}else h+=`<p>${endings15[q.ending].text} The world remains open for exploration and community projects.</p><button onclick="post15()" ${q.postDay===s.day?'disabled':''}>Harmony follow-up assignment</button><p>Follow-ups completed: ${q.postCount}</p>`;}
 return h+'</section>';}

setup();</script></body></html>
