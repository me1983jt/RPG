name: Build Maine CE APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maine-build-from-zip.yml'
      - 'Maine-CE-Alpha-27-HD-Characters-Source.zip'
      - 'Maine-CE-Alpha-28-York-Source.zip'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract Maine source
        run: |
          if [ -f Maine-CE-Alpha-28-York-Source.zip ]; then
            SOURCE=Maine-CE-Alpha-28-York-Source.zip
            echo "MAINE_VERSION=28" >> "$GITHUB_ENV"
          else
            SOURCE=Maine-CE-Alpha-27-HD-Characters-Source.zip
            echo "MAINE_VERSION=27" >> "$GITHUB_ENV"
          fi
          unzip -q "$SOURCE" -d maine-source
          test -f maine-source/CMakeLists.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android tools
        run: |
          java -version
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-32' 'build-tools;32.0.0' 'ndk;23.1.7779620' 'cmake;3.22.1'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Regression tests
        working-directory: maine-source
        run: |
          # Explicit CommonJS extension avoids runtime module-format ambiguity.
          cp gameplay-core/rules.js gameplay-core/rules.cjs
          sed -i 's@gameplay-core/rules.js@gameplay-core/rules.cjs@g' tests/parity.cjs
          node -e "if(typeof require('./gameplay-core/rules.cjs').skillChance !== 'function') process.exit(1)"
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-tests --parallel 2
          ctest --test-dir build-tests --output-on-failure
      - name: Prepare dependencies
        working-directory: maine-source
        run: python3 tools/prepare-native.py "$RUNNER_TEMP/maine-deps" --fetch
      - name: Fix native header search path
        working-directory: maine-source
        run: |
          test -f engine/src/maine/snow-terrain.h
          printf '\nif(TARGET fallout2-ce)\n  target_include_directories(fallout2-ce PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/src")\nendif()\n' >> engine/CMakeLists.txt
      - name: Build APK
        working-directory: maine-source/engine/os/android
        run: bash gradlew --no-daemon -PmaineDeps="$RUNNER_TEMP/maine-deps" assembleDebug
      - name: Verify APK
        run: |
          APK=maine-source/engine/os/android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/32.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libfallout2-ce.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Maine-Alpha-${{ env.MAINE_VERSION }}-APK
          path: maine-source/engine/os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
