<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Castle · Dixville Notch</title>
<style>
body{margin:0;min-height:100vh;color:#f0e2c0;font:16px/1.4 system-ui,sans-serif;display:flex;align-items:flex-end;justify-content:center;background:#1c1814 url(/game/castle/hotel_drive.jpg) center/cover no-repeat}
main{max-width:32rem;margin:1rem;padding:1rem 1.2rem;border:3px solid #6a4e32;background:rgba(42,30,18,.92);box-shadow:inset 0 0 12px #000}
h1{margin:0 0 .4rem;font-size:1.35rem;text-shadow:1px 1px 0 #000}p{margin:.3rem 0}
button{display:block;width:100%;margin:.6rem 0 0;padding:.7rem;font:inherit;font-weight:700;background:linear-gradient(#5e4630,#3a2a1a);color:#f0e2c0;border:2px solid #6a4e32}
small{color:#b8a07a}
</style></head><body><main>
<h1>The Castle · Dixville Notch</h1>
<p>The old grand hotel stands over Lake Gloriette, its tower dark. The gate lodge is chained and the drive is grown up in fireweed.</p>
<p><small>Nobody answers yet. The people of the notch are still getting settled; come back in a later version.</small></p>
<button id="leave">Head back down the notch road</button>
</main><script>
let S = null;
const post = (m) => parent.postMessage(m, "*");
addEventListener("message", (e) => { if (e.source === parent && e.data && e.data.type === "enterTown") S = e.data.state; });
document.getElementById("leave").onclick = () => S && post({ type: "leaveTown", exit: "town", state: S });
post({ type: "ready", town: "castle" });
</script></body></html>
